name: Auto-Bump AMR Cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  bump:
    name: Sync Latest 1orgar/amr Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Latest Release & Update Cask
        run: |
          set -euo pipefail
          REL_JSON="$(curl -fsSL https://api.github.com/repos/1orgar/amr/releases/latest)"
          TAG="$(printf '%s' "$REL_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')"
          VER="${TAG#v}"
          SHA_LINE="$(curl -fsSL "https://github.com/1orgar/amr/releases/download/${TAG}/AppleMusicRemoteMac-Universal.dmg.sha256")"
          SHA="$(printf '%s' "$SHA_LINE" | awk '{print $1}')"

          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid SHA-256 fetched: $SHA"
            exit 1
          fi

          CUR_VER="$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/amr.rb)"
          echo "Current cask: $CUR_VER | Latest release: $VER ($SHA)"

          if [[ "$CUR_VER" == "$VER" ]]; then
            echo "Already up to date."
            exit 0
          fi

          python3 - "$VER" "$SHA" <<'PY'
          import pathlib, re, sys
          ver, sha = sys.argv[1], sys.argv[2]
          p = pathlib.Path("Casks/amr.rb")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'version\s+"[^"]+"', f'version "{ver}"', txt, count=1)
          txt = re.sub(r'sha256\s+"[0-9a-f]{64}"', f'sha256 "{sha}"', txt, count=1)
          p.write_text(txt, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/amr.rb
          git commit -m "bump(amr): update to v${VER}"
          git push origin HEAD:main
